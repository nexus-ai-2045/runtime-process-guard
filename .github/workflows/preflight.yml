name: preflight

# repo-preflight の共通 CI ゲート。全履歴を検査し、.repo-preflight/ratchet-baseline.json
# とのラチェットで判定する。
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gate:
    uses: nexus-ai-2045/repo-preflight/.github/workflows/preflight-gate.yml@22c2f4be632c726910553f2c351e4a14158c0b4a # main（#89 の修正入り）
    with:
      preflight-ref: 22c2f4be632c726910553f2c351e4a14158c0b4a
