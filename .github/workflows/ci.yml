name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip pytest -e .

      - name: Run tests
        run: python -m pytest

      - name: Build standalone wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Install wheel in isolated environment
        shell: bash
        run: |
          python -m venv .wheel-venv
          if [ -f .wheel-venv/Scripts/python.exe ]; then
            PY=.wheel-venv/Scripts/python.exe
          else
            PY=.wheel-venv/bin/python
          fi
          "$PY" -m pip install dist/*.whl
          python scripts/verify_installed_distribution.py --python "$PY"

  consistency:
    # .repo-preflight-consistency.json を宣言だけで終わらせず実行する。
    # 検査ロジックは複製せず、upstream repo-preflight を固定SHAで checkout して呼ぶ。
    name: repo-preflight consistency gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout repo-preflight (upstream, pinned)
        uses: actions/checkout@v4
        with:
          repository: nexus-ai-2045/repo-preflight
          ref: b484112e65f1a1a9ad46017b4eb8a64a75644847
          path: .tools/repo-preflight
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Resolve consistency base
        id: base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              BASE="refs/remotes/origin/${PR_BASE_REF}"
              git rev-parse --verify -q "$BASE" >/dev/null
              ;;
            push)
              if [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
                && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
                BASE="$BEFORE_SHA"
              elif git rev-parse --verify -q HEAD^ >/dev/null; then
                # 新規ブランチの初回 push は before が all-zero。直前のコミットと比べる。
                BASE="$(git rev-parse HEAD^)"
              else
                # 比較元が無い初回コミットは、空ツリーと比べて全ファイルを検査する。
                BASE="$(git hash-object -t tree /dev/null)"
              fi
              ;;
            *)
              echo "unsupported event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac
          echo "base_ref=$BASE" >> "$GITHUB_OUTPUT"
          echo "Resolved consistency base_ref=$BASE event=$EVENT_NAME"

      - name: repo-preflight consistency gate
        env:
          CONSISTENCY_BASE: ${{ steps.base.outputs.base_ref }}
        run: python .tools/repo-preflight/scripts/consistency_gate.py --repo . --base-ref "$CONSISTENCY_BASE" --require-config --require-mode shadow --json
